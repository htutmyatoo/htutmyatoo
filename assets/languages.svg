<circle cx="125" cy="115" r="78" fill="none" stroke="#2b3948" stroke-width="20"/>
<circle cx="125" cy="115" r="78" fill="none" stroke="#33b8a5" stroke-width="20" stroke-dasharray="319.1907 170.8977" stroke-dashoffset="0.0000" transform="rotate(-90 125 115)"/>
<circle cx="125" cy="115" r="78" fill="none" stroke="#65dbb5" stroke-width="20" stroke-dasharray="93.0472 397.0413" stroke-dashoffset="-319.1907" transform="rotate(-90 125 115)"/>
<circle cx="125" cy="115" r="78" fill="none" stroke="#62a6e8" stroke-width="20" stroke-dasharray="48.4912 441.5973" stroke-dashoffset="-412.2379" transform="rotate(-90 125 115)"/>
<circle cx="125" cy="115" r="78" fill="none" stroke="#9184e8" stroke-width="20" stroke-dasharray="17.3445 472.7440" stroke-dashoffset="-460.7291" transform="rotate(-90 125 115)"/>
<circle cx="125" cy="115" r="78" fill="none" stroke="#ecc373" stroke-width="20" stroke-dasharray="7.8034 482.2851" stroke-dashoffset="-478.0736" transform="rotate(-90 125 115)"/>
