<text x="125" y="113" text-anchor="middle" fill="#f4f7fb" font-size="24" font-weight="700" font-family="Arial,sans-serif">6</text>
<text x="125" y="132" text-anchor="middle" fill="#9aabba" font-size="12" font-family="Arial,sans-serif">languages</text>
<circle cx="260" cy="57" r="6" fill="#33b8a5"/>
<text x="276" y="62" fill="#e6edf5" font-size="14" font-family="Arial,sans-serif">Dart</text>
<text x="520" y="62" text-anchor="end" fill="#b8c8d6" font-size="14" font-family="Arial,sans-serif">61.2%</text>
