<svg xmlns="http://www.w3.org/2000/svg" width="550" height="230" viewBox="0 0 550 230" role="img" aria-labelledby="title desc">
<title id="title">Code distribution across repositories</title>
<desc id="desc">Language percentages represent GitHub-reported code bytes, not proficiency or commits.</desc>
<rect width="550" height="230" rx="16" fill="#101b28"/>
<circle cx="125" cy="115" r="78" fill="none" stroke="#2b3948" stroke-width="20"/>
<circle cx="125" cy="115" r="78" fill="none" stroke="#33b8a5" stroke-width="20" stroke-dasharray="299.9483 190.1402" stroke-dashoffset="0.0000" transform="rotate(-90 125 115)"/>
<circle cx="125" cy="115" r="78" fill="none" stroke="#65dbb5" stroke-width="20" stroke-dasharray="116.9829 373.1056" stroke-dashoffset="-299.9483" transform="rotate(-90 125 115)"/>
<circle cx="125" cy="115" r="78" fill="none" stroke="#62a6e8" stroke-width="20" stroke-dasharray="45.5679 444.5206" stroke-dashoffset="-416.9311" transform="rotate(-90 125 115)"/>
<circle cx="125" cy="115" r="78" fill="none" stroke="#9184e8" stroke-width="20" stroke-dasharray="16.2989 473.7896" stroke-dashoffset="-462.4990" transform="rotate(-90 125 115)"/>
<circle cx="125" cy="115" r="78" fill="none" stroke="#ecc373" stroke-width="20" stroke-dasharray="7.3329 482.7555" stroke-dashoffset="-478.7979" transform="rotate(-90 125 115)"/>
